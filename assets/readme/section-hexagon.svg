<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="120" viewBox="0 0 1200 120"
     role="img" aria-labelledby="sxTitle sxDesc">
  <title id="sxTitle">六边形记忆法 · 一图打包恒等式</title>
  <desc id="sxDesc">六边形记忆法章节标题，右侧为小六边形装饰。</desc>

  <defs>
    <clipPath id="sxClip"><rect width="1200" height="120" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#sxClip)">
    <rect width="1200" height="120" fill="#1b1a16"/>
    <rect x="0" y="0" width="6" height="120" fill="#b3a4cc"/>
  </g>

  <text x="48" y="86" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace" font-size="56" font-weight="800" fill="#b3a4cc" fill-opacity="0.22">03</text>

  <text x="160" y="47" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="3.5" fill="#b3a4cc">TRIGONOMETRY</text>
  <text x="160" y="85" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="27" font-weight="800" fill="#ecebe2">六边形记忆法 · 一图打包恒等式</text>

  <!-- 右侧装饰：小六边形 + 对角线 -->
  <g>
    <path d="M 1092,32 L 1117,46.5 L 1117,73.5 L 1092,88 L 1067,73.5 L 1067,46.5 Z" fill="none" stroke="#b3a4cc" stroke-opacity="0.55" stroke-width="1.4"/>
    <line x1="1092" y1="32" x2="1092" y2="88" stroke="#c9ab74" stroke-opacity="0.55" stroke-width="1.1" stroke-dasharray="3.5 3"/>
    <line x1="1117" y1="46.5" x2="1067" y2="73.5" stroke="#c9ab74" stroke-opacity="0.55" stroke-width="1.1" stroke-dasharray="3.5 3"/>
    <line x1="1067" y1="46.5" x2="1117" y2="73.5" stroke="#c9ab74" stroke-opacity="0.55" stroke-width="1.1" stroke-dasharray="3.5 3"/>
    <circle cx="1092" cy="60" r="4" fill="#232119" stroke="#ecebe2" stroke-opacity="0.55" stroke-width="1"/>
  </g>
</svg>
