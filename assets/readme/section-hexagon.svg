<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="140" viewBox="0 0 1200 140"
     role="img" aria-labelledby="s4Title s4Desc">
  <title id="s4Title">六边形记忆法 · 一图打包所有恒等式</title>
  <desc id="s4Desc">三角函数宇宙无敌最强六边形记忆法章节标题。</desc>

  <defs>
    <linearGradient id="s4Bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#BF5AF2"/>
      <stop offset="100%" stop-color="#BF5AF2" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="140" rx="20" fill="#0F1320"/>
  <rect x="0" y="0" width="6" height="140" rx="3" fill="url(#s4Bar)"/>

  <text x="64" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="64" font-weight="800" fill="#BF5AF2" fill-opacity="0.25">04</text>

  <text x="180" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#BF5AF2" letter-spacing="3">HEXAGON METHOD</text>
  <text x="180" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="32" font-weight="800" fill="#FFFFFF">一图打包所有恒等式</text>

  <!-- 右侧装饰：迷你六边形 -->
  <g transform="translate(1070 70)" fill="none" stroke="#BF5AF2" stroke-width="1.5">
    <polygon points="0,-26 22,-13 22,13 0,26 -22,13 -22,-13" stroke-opacity="0.7"/>
    <polygon points="0,-14 12,-7 12,7 0,14 -12,7 -12,-7" fill="#BF5AF2" fill-opacity="0.15"/>
    <line x1="0" y1="-26" x2="0" y2="26" stroke-opacity="0.3" stroke-dasharray="3 3"/>
    <line x1="-22" y1="-13" x2="22" y2="13" stroke-opacity="0.3" stroke-dasharray="3 3"/>
    <line x1="22" y1="-13" x2="-22" y2="13" stroke-opacity="0.3" stroke-dasharray="3 3"/>
  </g>
</svg>
