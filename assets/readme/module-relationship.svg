<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="440" viewBox="0 0 1200 440"
     role="img" aria-labelledby="relTitle relDesc">
  <title id="relTitle">11 个模块的联动学习路径</title>
  <desc id="relDesc">第一行一元主线：函数极限连续 → 求导 → 导数与微分 → 逆运算 → 一元积分 → 综合 → 微分方程；三角函数贯穿一元与多元。第二行升维：多元函数微分学 → 二重积分 → 无穷级数。第三行线性代数：行列式 → 矩阵 → 线性方程组。</desc>

  <defs>
    <marker id="arrowInk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9b9a8d"/>
    </marker>
    <marker id="arrowInkSoft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9b9a8d" fill-opacity="0.7"/>
    </marker>
  </defs>

  <!-- 纸张底 -->
  <rect width="1200" height="440" rx="24" fill="#1b1a16"/>

  <!-- ===== 第一行：一元主线 ===== -->
  <!-- 卡 1：函数·极限·连续 -->
  <g>
    <rect x="56" y="56" width="190" height="72" rx="12" fill="#232119" stroke="#ecebe2" stroke-opacity="0.10"/>
    <rect x="56" y="66" width="3" height="52" rx="1.5" fill="#8fb0c4"/>
    <text x="74" y="86" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#ecebe2">函数·极限·连续</text>
    <text x="74" y="108" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#9b9a8d">极限工具 · 地基</text>
  </g>

  <!-- 卡 2：导数与微分 -->
  <g>
    <rect x="300" y="56" width="190" height="72" rx="12" fill="#232119" stroke="#ecebe2" stroke-opacity="0.10"/>
    <rect x="300" y="66" width="3" height="52" rx="1.5" fill="#b3a4cc"/>
    <text x="318" y="86" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#ecebe2">导数与微分</text>
    <text x="318" y="108" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#9b9a8d">f′(x) · 核心枢纽</text>
  </g>

  <!-- 卡 3：一元函数积分学 -->
  <g>
    <rect x="544" y="56" width="190" height="72" rx="12" fill="#232119" stroke="#ecebe2" stroke-opacity="0.10"/>
    <rect x="544" y="66" width="3" height="52" rx="1.5" fill="#6fae87"/>
    <text x="562" y="86" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#ecebe2">一元函数积分学</text>
    <text x="562" y="108" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#9b9a8d">∫f(x)dx · 导数的逆</text>
  </g>

  <!-- 卡 4：微分方程 -->
  <g>
    <rect x="788" y="56" width="190" height="72" rx="12" fill="#232119" stroke="#ecebe2" stroke-opacity="0.10"/>
    <rect x="788" y="66" width="3" height="52" rx="1.5" fill="#c9ab74"/>
    <text x="806" y="86" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#ecebe2">微分方程</text>
    <text x="806" y="108" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#9b9a8d">y′=f(x,y) · 综合</text>
  </g>

  <!-- 行内箭头与标签 -->
  <line x1="250" y1="92" x2="294" y2="92" stroke="#9b9a8d" stroke-opacity="0.55" stroke-width="1.5" marker-end="url(#arrowInk)"/>
  <text x="273" y="84" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#9b9a8d">求导</text>

  <line x1="494" y1="92" x2="538" y2="92" stroke="#9b9a8d" stroke-opacity="0.55" stroke-width="1.5" marker-end="url(#arrowInk)"/>
  <text x="517" y="84" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#9b9a8d">逆运算</text>

  <line x1="738" y1="92" x2="782" y2="92" stroke="#9b9a8d" stroke-opacity="0.55" stroke-width="1.5" marker-end="url(#arrowInk)"/>
  <text x="761" y="84" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#9b9a8d">综合应用</text>

  <!-- 三角函数：贯穿一元与多元 -->
  <g>
    <rect x="1016" y="48" width="128" height="220" rx="12" fill="#232119" stroke="#cd9b94" stroke-opacity="0.35"/>
    <rect x="1016" y="58" width="3" height="200" rx="1.5" fill="#cd9b94"/>
    <text x="1034" y="92" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#cd9b94">三角函数</text>
    <text x="1034" y="120" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#ecebe2" fill-opacity="0.75">sin²x+cos²x=1</text>
    <text x="1034" y="146" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#9b9a8d">关系式贯穿</text>
    <text x="1034" y="164" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#9b9a8d">一元与多元，</text>
    <text x="1034" y="182" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#9b9a8d">是网络不是清单</text>
    <text x="1034" y="222" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace" font-size="10" fill="#cd9b94">41 条 · 关系网络</text>
  </g>
  <line x1="982" y1="92" x2="1012" y2="92" stroke="#cd9b94" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="900" y1="222" x2="1012" y2="222" stroke="#cd9b94" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- 换行箭头：微分方程 → 多元函数微分学 -->
  <path d="M 883 128 L 883 157 L 176 157 L 176 180" fill="none" stroke="#9b9a8d" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowInkSoft)"/>
  <text x="529" y="150" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#9b9a8d">升维 · 一元 → 多元</text>

  <!-- ===== 第二行：多元与无穷 ===== -->
  <!-- 卡 5：多元函数微分学 -->
  <g>
    <rect x="56" y="186" width="240" height="72" rx="12" fill="#232119" stroke="#ecebe2" stroke-opacity="0.10"/>
    <rect x="56" y="196" width="3" height="52" rx="1.5" fill="#7fb8a8"/>
    <text x="74" y="216" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#ecebe2">多元函数微分学</text>
    <text x="74" y="238" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#9b9a8d">偏导 · 全微分 · 链式</text>
  </g>

  <!-- 卡 6：二重积分 -->
  <g>
    <rect x="356" y="186" width="240" height="72" rx="12" fill="#232119" stroke="#ecebe2" stroke-opacity="0.10"/>
    <rect x="356" y="196" width="3" height="52" rx="1.5" fill="#b3a4cc"/>
    <text x="374" y="216" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#ecebe2">二重积分</text>
    <text x="374" y="238" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#9b9a8d">∬f dσ · 定积分的升维</text>
  </g>

  <!-- 卡 7：无穷级数 -->
  <g>
    <rect x="656" y="186" width="240" height="72" rx="12" fill="#232119" stroke="#ecebe2" stroke-opacity="0.10"/>
    <rect x="656" y="196" width="3" height="52" rx="1.5" fill="#E91E63"/>
    <text x="674" y="216" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#ecebe2">无穷级数</text>
    <text x="674" y="238" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#9b9a8d">Σuₙ · 判敛求和 · 幂级数</text>
  </g>

  <line x1="300" y1="222" x2="348" y2="222" stroke="#9b9a8d" stroke-opacity="0.55" stroke-width="1.5" marker-end="url(#arrowInk)"/>
  <text x="326" y="214" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#9b9a8d">继续升维</text>

  <line x1="600" y1="222" x2="648" y2="222" stroke="#9b9a8d" stroke-opacity="0.55" stroke-width="1.5" marker-end="url(#arrowInk)"/>
  <text x="626" y="214" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#9b9a8d">有限到无限</text>

  <!-- 换行箭头：无穷级数 → 行列式 -->
  <path d="M 776 258 L 776 286 L 176 286 L 176 308" fill="none" stroke="#9b9a8d" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowInkSoft)"/>
  <text x="476" y="279" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#9b9a8d">并列 · 线性代数</text>

  <!-- ===== 第三行：线性代数 ===== -->
  <!-- 卡 8：行列式 -->
  <g>
    <rect x="56" y="314" width="240" height="72" rx="12" fill="#232119" stroke="#ecebe2" stroke-opacity="0.10"/>
    <rect x="56" y="324" width="3" height="52" rx="1.5" fill="#759ba1"/>
    <text x="74" y="344" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#ecebe2">行列式</text>
    <text x="74" y="366" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#9b9a8d">|A| · 线代判据</text>
  </g>

  <!-- 卡 9：矩阵 -->
  <g>
    <rect x="356" y="314" width="240" height="72" rx="12" fill="#232119" stroke="#ecebe2" stroke-opacity="0.10"/>
    <rect x="356" y="324" width="3" height="52" rx="1.5" fill="#8b98ba"/>
    <text x="374" y="344" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#ecebe2">矩阵</text>
    <text x="374" y="366" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#9b9a8d">A⁻¹ · 初等变换 · 秩</text>
  </g>

  <!-- 卡 10：线性方程组 -->
  <g>
    <rect x="656" y="314" width="240" height="72" rx="12" fill="#232119" stroke="#ecebe2" stroke-opacity="0.10"/>
    <rect x="656" y="324" width="3" height="52" rx="1.5" fill="#9b8bb4"/>
    <text x="674" y="344" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#ecebe2">线性方程组</text>
    <text x="674" y="366" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#9b9a8d">R(A) 与 R(A|b) 判解</text>
  </g>

  <line x1="300" y1="350" x2="348" y2="350" stroke="#9b9a8d" stroke-opacity="0.55" stroke-width="1.5" marker-end="url(#arrowInk)"/>
  <text x="326" y="342" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#9b9a8d">基础工具</text>

  <line x1="600" y1="350" x2="648" y2="350" stroke="#9b9a8d" stroke-opacity="0.55" stroke-width="1.5" marker-end="url(#arrowInk)"/>
  <text x="626" y="342" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#9b9a8d">求解工具</text>
</svg>
