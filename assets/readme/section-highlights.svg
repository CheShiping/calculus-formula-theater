<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="140" viewBox="0 0 1200 140"
     role="img" aria-labelledby="s1Title s1Desc">
  <title id="s1Title">亮点 · 为什么不一样</title>
  <desc id="s1Desc">项目核心亮点章节标题。</desc>

  <defs>
    <linearGradient id="s1Bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#0A84FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="140" rx="20" fill="#0F1320"/>
  <rect x="0" y="0" width="6" height="140" rx="3" fill="url(#s1Bar)"/>

  <!-- 大编号 -->
  <text x="64" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="64" font-weight="800" fill="#0A84FF" fill-opacity="0.25">01</text>

  <!-- 标题 -->
  <text x="180" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#0A84FF" letter-spacing="3">HIGHLIGHTS</text>
  <text x="180" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="32" font-weight="800" fill="#FFFFFF">为什么不一样</text>

  <!-- 右侧装饰：卡片堆叠图标 -->
  <g transform="translate(1040 50)">
    <rect x="20" y="0" width="60" height="40" rx="6" fill="none" stroke="#0A84FF" stroke-opacity="0.3" stroke-width="1.5" transform="skewY(-8)"/>
    <rect x="10" y="6" width="60" height="40" rx="6" fill="none" stroke="#0A84FF" stroke-opacity="0.5" stroke-width="1.5" transform="skewY(-4)"/>
    <rect x="0" y="12" width="60" height="40" rx="6" fill="#0A84FF" fill-opacity="0.15" stroke="#0A84FF" stroke-width="1.5"/>
  </g>
</svg>
