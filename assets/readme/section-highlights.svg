<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="120" viewBox="0 0 1200 120"
     role="img" aria-labelledby="shTitle shDesc">
  <title id="shTitle">亮点 · 三层联动记忆</title>
  <desc id="shDesc">项目核心亮点章节标题。</desc>

  <defs>
    <clipPath id="hlClip"><rect width="1200" height="120" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#hlClip)">
    <rect width="1200" height="120" fill="#1b1a16"/>
    <rect x="0" y="0" width="6" height="120" fill="#6fae87"/>
  </g>

  <text x="48" y="86" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace" font-size="56" font-weight="800" fill="#6fae87" fill-opacity="0.22">01</text>

  <text x="160" y="47" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="3.5" fill="#6fae87">WHY DIFFERENT</text>
  <text x="160" y="85" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="27" font-weight="800" fill="#ecebe2">亮点 · 三层联动记忆</text>

  <!-- 右侧装饰：公式卡叠影（3px 左色条母题） -->
  <g>
    <rect x="1074" y="30" width="70" height="22" rx="5" fill="none" stroke="#6fae87" stroke-opacity="0.30" stroke-width="1.2"/>
    <rect x="1064" y="50" width="70" height="22" rx="5" fill="none" stroke="#6fae87" stroke-opacity="0.50" stroke-width="1.2"/>
    <rect x="1054" y="70" width="70" height="22" rx="5" fill="#6fae87" fill-opacity="0.10" stroke="#6fae87" stroke-opacity="0.75" stroke-width="1.2"/>
    <rect x="1054" y="70" width="2.5" height="22" rx="1" fill="#6fae87"/>
  </g>
</svg>
