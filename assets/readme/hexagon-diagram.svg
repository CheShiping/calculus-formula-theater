<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="520" viewBox="0 0 1200 520"
     role="img" aria-labelledby="hexTitle hexDesc">
  <title id="hexTitle">三角函数六边形记忆法</title>
  <desc id="hexDesc">平顶六边形：tan 在正上，sin/cos 在上两侧，cot/csc 在下两侧，sec 在左下，中心是 1。对角线是倒数关系，三个阴影三角形给出平方关系，顺时针相邻顶点给出商数关系。</desc>

  <!-- 纸张底 -->
  <rect width="1200" height="520" rx="24" fill="#1b1a16"/>

  <!-- ===== 左侧：六边形主图（与站内交互 SVG 同一几何） ===== -->
  <!-- 三个阴影三角形（平方关系）：顶 / 左 / 右 -->
  <polygon points="166,177 494,177 330,272" fill="#6fae87" fill-opacity="0.07" stroke="#6fae87" stroke-opacity="0.18" stroke-width="1"/>
  <polygon points="330,82 166,367 330,272" fill="#6fae87" fill-opacity="0.07" stroke="#6fae87" stroke-opacity="0.18" stroke-width="1"/>
  <polygon points="494,367 330,462 330,272" fill="#6fae87" fill-opacity="0.07" stroke="#6fae87" stroke-opacity="0.18" stroke-width="1"/>

  <!-- 六边形边框：tan → cos → cot → csc → sec → sin -->
  <path d="M 330,82 L 494,177 L 494,367 L 330,462 L 166,367 L 166,177 Z"
        fill="none" stroke="#ecebe2" stroke-opacity="0.28" stroke-width="2"/>

  <!-- 三条对角线（倒数关系，琥珀虚线） -->
  <line x1="330" y1="82" x2="330" y2="462" stroke="#c9ab74" stroke-width="1.5" stroke-dasharray="5 4" stroke-opacity="0.55"/>
  <line x1="494" y1="177" x2="166" y2="367" stroke="#c9ab74" stroke-width="1.5" stroke-dasharray="5 4" stroke-opacity="0.55"/>
  <line x1="166" y1="177" x2="494" y2="367" stroke="#c9ab74" stroke-width="1.5" stroke-dasharray="5 4" stroke-opacity="0.55"/>

  <!-- 中心 "1" -->
  <circle cx="330" cy="272" r="24" fill="#232119" stroke="#ecebe2" stroke-opacity="0.30" stroke-width="1.5"/>
  <text x="330" y="278" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="800" fill="#ecebe2">1</text>

  <!-- 顶点：tan（正上） -->
  <circle cx="330" cy="82" r="30" fill="#cd9b94" fill-opacity="0.10"/>
  <circle cx="330" cy="82" r="26" fill="#232119" stroke="#cd9b94" stroke-width="2"/>
  <text x="330" y="87" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" fill="#cd9b94">tan</text>

  <!-- sin（左上） -->
  <circle cx="166" cy="177" r="30" fill="#8fb0c4" fill-opacity="0.10"/>
  <circle cx="166" cy="177" r="26" fill="#232119" stroke="#8fb0c4" stroke-width="2"/>
  <text x="166" y="182" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" fill="#8fb0c4">sin</text>

  <!-- cos（右上） -->
  <circle cx="494" cy="177" r="30" fill="#6fae87" fill-opacity="0.10"/>
  <circle cx="494" cy="177" r="26" fill="#232119" stroke="#6fae87" stroke-width="2"/>
  <text x="494" y="182" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" fill="#6fae87">cos</text>

  <!-- cot（右下） -->
  <circle cx="494" cy="367" r="30" fill="#c9ab74" fill-opacity="0.10"/>
  <circle cx="494" cy="367" r="26" fill="#232119" stroke="#c9ab74" stroke-width="2"/>
  <text x="494" y="372" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" fill="#c9ab74">cot</text>

  <!-- csc（正下） -->
  <circle cx="330" cy="462" r="30" fill="#c98d5f" fill-opacity="0.10"/>
  <circle cx="330" cy="462" r="26" fill="#232119" stroke="#c98d5f" stroke-width="2"/>
  <text x="330" y="467" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" fill="#c98d5f">csc</text>

  <!-- sec（左下） -->
  <circle cx="166" cy="367" r="30" fill="#b3a4cc" fill-opacity="0.10"/>
  <circle cx="166" cy="367" r="26" fill="#232119" stroke="#b3a4cc" stroke-width="2"/>
  <text x="166" y="372" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" fill="#b3a4cc">sec</text>

  <!-- 图内标注 -->
  <text x="330" y="44" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#6fae87">顶部三角 · sin² + cos² = 1</text>
  <text x="330" y="508" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#c9ab74">⋯ 对角线 = 倒数关系 ⋯</text>

  <!-- ===== 右侧：三大规则说明（与站内原文一致） ===== -->
  <text x="620" y="66" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="3" fill="#b3a4cc">HEXAGON RULES</text>
  <text x="620" y="100" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="800" fill="#ecebe2">三大规则，一图打包</text>

  <!-- 规则一 · 倒数关系 -->
  <g>
    <rect x="620" y="128" width="3" height="52" rx="1.5" fill="#c9ab74"/>
    <text x="640" y="146" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#c9ab74">规则一 · 倒数关系</text>
    <text x="640" y="170" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#b9b8ac">对角线两端互为倒数（琥珀色虚线）</text>
    <text x="640" y="192" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace" font-size="12" fill="#9b9a8d">sin·csc = cos·sec = tan·cot = 1</text>
  </g>

  <!-- 规则二 · 平方关系 -->
  <g>
    <rect x="620" y="224" width="3" height="52" rx="1.5" fill="#6fae87"/>
    <text x="640" y="242" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#6fae87">规则二 · 平方关系</text>
    <text x="640" y="266" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#b9b8ac">三个阴影三角形各给出一条平方恒等式</text>
    <text x="640" y="288" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace" font-size="12" fill="#9b9a8d">sin²+cos²=1 · 1+tan²=sec² · 1+cot²=csc²</text>
  </g>

  <!-- 规则三 · 商数关系 -->
  <g>
    <rect x="620" y="320" width="3" height="52" rx="1.5" fill="#8fb0c4"/>
    <text x="640" y="338" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#8fb0c4">规则三 · 商数关系</text>
    <text x="640" y="362" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#b9b8ac">顺时针方向，每个函数 = 下一个 ÷ 再下一个</text>
    <text x="640" y="384" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace" font-size="12" fill="#9b9a8d">tan = sin/cos · cot = cos/sin</text>
  </g>

  <!-- 记忆口诀 -->
  <g>
    <rect x="620" y="412" width="500" height="64" rx="12" fill="#6fae87" fill-opacity="0.08" stroke="#6fae87" stroke-opacity="0.30"/>
    <text x="640" y="436" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="700" fill="#6fae87">记忆口诀</text>
    <text x="640" y="462" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#ecebe2">中下二、下中下、导相乘、对对和</text>
  </g>
</svg>
