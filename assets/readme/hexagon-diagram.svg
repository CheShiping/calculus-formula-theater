<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="520" viewBox="0 0 1200 520"
     role="img" aria-labelledby="hexTitle hexDesc">
  <title id="hexTitle">宇宙无敌最强六边形记忆法</title>
  <desc id="hexDesc">三角函数六边形记忆法：六个顶点是六个三角函数，对角线是倒数关系，三个阴影三角形是平方关系。</desc>

  <defs>
    <linearGradient id="hexBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F1320"/>
      <stop offset="100%" stop-color="#0B0E14"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="520" rx="24" fill="url(#hexBg)"/>

  <!-- 左侧：六边形主图 -->
  <g transform="translate(360 260)">
    <!-- 三个阴影三角形（平方关系）-->
    <!-- tan² + 1 = sec²（右侧三角）-->
    <polygon points="0,-200 173,100 -173,100" fill="#BF5AF2" fill-opacity="0.05"/>
    <!-- sin² + cos² = 1（左下到顶部）-->
    <polygon points="0,-200 -173,-100 173,-100" fill="#FFD60A" fill-opacity="0.05"/>
    <!-- cot² + 1 = csc²（底部）-->
    <polygon points="-173,100 173,100 0,-200" fill="#30D158" fill-opacity="0.05"/>

    <!-- 三条对角线（倒数关系，黄色虚线）-->
    <line x1="0" y1="-200" x2="0" y2="200" stroke="#FFD60A" stroke-width="1.5" stroke-dasharray="6 5" stroke-opacity="0.55"/>
    <line x1="173" y1="-100" x2="-173" y2="100" stroke="#FFD60A" stroke-width="1.5" stroke-dasharray="6 5" stroke-opacity="0.55"/>
    <line x1="-173" y1="-100" x2="173" y2="100" stroke="#FFD60A" stroke-width="1.5" stroke-dasharray="6 5" stroke-opacity="0.55"/>

    <!-- 六边形边框 -->
    <polygon points="0,-200 173,-100 173,100 0,200 -173,100 -173,-100"
             fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.25"/>

    <!-- 六个顶点 -->
    <!-- 顶部：sin -->
    <circle cx="0" cy="-200" r="34" fill="#0A84FF" fill-opacity="0.2" stroke="#0A84FF" stroke-width="2"/>
    <text x="0" y="-194" text-anchor="middle" font-family="ui-monospace, monospace" font-size="16" font-weight="700" fill="#0A84FF">sin</text>

    <!-- 右上：cos -->
    <circle cx="173" cy="-100" r="34" fill="#30D158" fill-opacity="0.2" stroke="#30D158" stroke-width="2"/>
    <text x="173" y="-94" text-anchor="middle" font-family="ui-monospace, monospace" font-size="16" font-weight="700" fill="#30D158">cos</text>

    <!-- 右下：tan -->
    <circle cx="173" cy="100" r="34" fill="#FFD60A" fill-opacity="0.2" stroke="#FFD60A" stroke-width="2"/>
    <text x="173" y="106" text-anchor="middle" font-family="ui-monospace, monospace" font-size="16" font-weight="700" fill="#FFD60A">tan</text>

    <!-- 底部：csc -->
    <circle cx="0" cy="200" r="34" fill="#FF453A" fill-opacity="0.2" stroke="#FF453A" stroke-width="2"/>
    <text x="0" y="206" text-anchor="middle" font-family="ui-monospace, monospace" font-size="16" font-weight="700" fill="#FF453A">csc</text>

    <!-- 左下：sec -->
    <circle cx="-173" cy="100" r="34" fill="#BF5AF2" fill-opacity="0.2" stroke="#BF5AF2" stroke-width="2"/>
    <text x="-173" y="106" text-anchor="middle" font-family="ui-monospace, monospace" font-size="16" font-weight="700" fill="#BF5AF2">sec</text>

    <!-- 左上：cot -->
    <circle cx="-173" cy="-100" r="34" fill="#FF9F0A" fill-opacity="0.2" stroke="#FF9F0A" stroke-width="2"/>
    <text x="-173" y="-94" text-anchor="middle" font-family="ui-monospace, monospace" font-size="16" font-weight="700" fill="#FF9F0A">cot</text>
  </g>

  <!-- 右侧：三大规则说明 -->
  <g transform="translate(640 80)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#BF5AF2" letter-spacing="3">MEMORY RULES</text>
    <text x="0" y="36" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">三大规则一图打包</text>

    <!-- 规则一 -->
    <g transform="translate(0 70)">
      <circle cx="12" cy="12" r="6" fill="#FFD60A"/>
      <text x="32" y="10" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="15" font-weight="700" fill="#FFD60A">规则一 · 倒数关系</text>
      <text x="32" y="32" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#D1D5DB">对角线两端互为倒数（黄色虚线）</text>
      <text x="32" y="52" font-family="ui-monospace, monospace" font-size="13" fill="#9CA3AF">sin·csc = cos·sec = tan·cot = 1</text>
    </g>

    <!-- 规则二 -->
    <g transform="translate(0 158)">
      <circle cx="12" cy="12" r="6" fill="#BF5AF2"/>
      <text x="32" y="10" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="15" font-weight="700" fill="#BF5AF2">规则二 · 平方关系</text>
      <text x="32" y="32" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#D1D5DB">三个阴影三角形各给一个恒等式</text>
      <text x="32" y="52" font-family="ui-monospace, monospace" font-size="13" fill="#9CA3AF">sin²+cos²=1 · tan²+1=sec² · 1+cot²=csc²</text>
    </g>

    <!-- 规则三 -->
    <g transform="translate(0 246)">
      <circle cx="12" cy="12" r="6" fill="#30D158"/>
      <text x="32" y="10" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="15" font-weight="700" fill="#30D158">规则三 · 导相乘 · 对对和</text>
      <text x="32" y="32" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#D1D5DB">相邻两顶点之积 = 中间顶点</text>
      <text x="32" y="52" font-family="ui-monospace, monospace" font-size="13" fill="#9CA3AF">sin·cos = tan · cos·sec = 1 · ...</text>
    </g>

    <!-- 口诀 -->
    <g transform="translate(0 334)">
      <rect x="0" y="0" width="440" height="68" rx="10" fill="#BF5AF2" fill-opacity="0.1" stroke="#BF5AF2" stroke-opacity="0.3"/>
      <text x="20" y="26" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="700" fill="#BF5AF2">记忆口诀</text>
      <text x="20" y="50" font-family="ui-monospace, monospace" font-size="14" fill="#FFFFFF">中下二、下中下、导相乘、对对和</text>
    </g>
  </g>
</svg>
