<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">

    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--background);
    --color-foreground: var(--foreground);
    --color-card: var(--card);
    --color-card-foreground: var(--card-foreground);

    --color-accent: var(--accent);
    --color-accent-foreground: var(--accent-foreground);
    --color-destructive: var(--destructive);
    --color-destructive-foreground: var(--destructive-foreground);
    --color-border: var(--border);
    --color-input: var(--input);
    --color-ring: var(--ring);
    --radius-sm: var(--radius-sm);
    --radius-md: var(--radius-md);
    --radius-lg: var(--radius-lg);
    --radius-xl: var(--radius-xl);
  }
  @layer base {

    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }

    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--background); }
      .text-background { color: var(--background); }
      .border-background { border-color: var(--background); }
      .ring-background { --tw-ring-color: var(--background); }

      .text-foreground { color: var(--foreground); }

      .ring-foreground { --tw-ring-color: var(--foreground); }
      .bg-card { background-color: var(--card); }
      .text-card { color: var(--card); }
      .border-card { border-color: var(--card); }
      .ring-card { --tw-ring-color: var(--card); }
      .bg-card-foreground { background-color: var(--card-foreground); }
      .text-card-foreground { color: var(--card-foreground); }
      .border-card-foreground { border-color: var(--card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--card-foreground); }
      .bg-popover { background-color: var(--popover); }
      .text-popover { color: var(--popover); }
      .border-popover { border-color: var(--popover); }
      .ring-popover { --tw-ring-color: var(--popover); }
      .bg-popover-foreground { background-color: var(--popover-foreground); }
      .text-popover-foreground { color: var(--popover-foreground); }
      .border-popover-foreground { border-color: var(--popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--popover-foreground); }
      .bg-primary { background-color: var(--primary); }
      .text-primary { color: var(--primary); }
      .border-primary { border-color: var(--primary); }
      .ring-primary { --tw-ring-color: var(--primary); }
      .bg-primary-foreground { background-color: var(--primary-foreground); }
      .text-primary-foreground { color: var(--primary-foreground); }
      .border-primary-foreground { border-color: var(--primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--primary-foreground); }
      .bg-secondary { background-color: var(--secondary); }
      .text-secondary { color: var(--secondary); }
      .border-secondary { border-color: var(--secondary); }
      .ring-secondary { --tw-ring-color: var(--secondary); }
      .bg-secondary-foreground { background-color: var(--secondary-foreground); }
      .text-secondary-foreground { color: var(--secondary-foreground); }
      .border-secondary-foreground { border-color: var(--secondary-foreground); }
      .ring-secondary-foreground { --tw-ring-color: var(--secondary-foreground); }
      .bg-muted { background-color: var(--muted); }
      .text-muted { color: var(--muted); }
      .border-muted { border-color: var(--muted); }
      .ring-muted { --tw-ring-color: var(--muted); }
      .bg-muted-foreground { background-color: var(--muted-foreground); }
      .text-muted-foreground { color: var(--muted-foreground); }
      .border-muted-foreground { border-color: var(--muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--muted-foreground); }
      .bg-accent { background-color: var(--accent); }
      .text-accent { color: var(--accent); }
      .border-accent { border-color: var(--accent); }
      .ring-accent { --tw-ring-color: var(--accent); }
      .bg-accent-foreground { background-color: var(--accent-foreground); }
      .text-accent-foreground { color: var(--accent-foreground); }
      .border-accent-foreground { border-color: var(--accent-foreground); }
      .ring-accent-foreground { --tw-ring-color: var(--accent-foreground); }
      .bg-destructive { background-color: var(--destructive); }
      .text-destructive { color: var(--destructive); }
      .border-destructive { border-color: var(--destructive); }
      .ring-destructive { --tw-ring-color: var(--destructive); }
      .bg-destructive-foreground { background-color: var(--destructive-foreground); }
      .text-destructive-foreground { color: var(--destructive-foreground); }
      .border-destructive-foreground { border-color: var(--destructive-foreground); }
      .ring-destructive-foreground { --tw-ring-color: var(--destructive-foreground); }
      .bg-border { background-color: var(--border); }
      .text-border { color: var(--border); }
      .border-border { border-color: var(--border); }
      .ring-border { --tw-ring-color: var(--border); }
      .bg-input { background-color: var(--input); }
      .text-input { color: var(--input); }
      .border-input { border-color: var(--input); }

      .bg-ring { background-color: var(--ring); }
      .text-ring { color: var(--ring); }
      .border-ring { border-color: var(--ring); }
      .ring-ring { --tw-ring-color: var(--ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body>

<nav class="nav" aria-label="主导航">
  <div class="nav-inner">
    <a href="01-home.html" class="brand">
      <span class="brand-mark"></span>
      <span>calculus-formula-theater</span>
    </a>
    <div class="nav-links">
      <a data-dom-id="nav-home" href="01-home.html">章节</a>
      <a data-dom-id="nav-review" href="03-review.html">翻卡</a>
      <a data-dom-id="nav-quiz" href="04-quiz.html" class="active" aria-current="page">自测</a>
      <a data-dom-id="nav-search" href="05-search.html">搜索</a>
    </div>
    <div class="nav-right">
      <a href="05-search.html" class="icon-btn" aria-label="搜索公式 /" title="搜索公式 /">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.3-4.3"></path>
        </svg>
      </a>
      <button class="icon-btn" id="themeBtn" title="切换主题" aria-label="切换主题">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="5"></circle>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
        </svg>
      </button>
    </div>
  </div>
</nav>

<main class="shell" id="app">

  <!-- 阶段 1：配置 -->
  <section class="stage is-active" id="configStage" aria-label="自测配置">
    <div class="config">
      <div class="crumbs">P0 · 公式自测练习</div>
      <h1 class="h-page">开始一轮自测</h1>
      <p class="lede">从公式库随机抽题，三种题型混合：选择、填空、判断。即时反馈，结束后生成成绩单。</p>

      <div class="field">
        <label id="moduleLabel">测试范围</label>
        <div class="pill-row" role="group" aria-labelledby="moduleLabel" id="modulePills">
          <button class="pill-btn active" data-value="all">全部</button>
          <button class="pill-btn" data-value="deriv">导数</button>
          <button class="pill-btn" data-value="integral">积分</button>
          <button class="pill-btn" data-value="trig">三角</button>
          <button class="pill-btn" data-value="diffEq">微分方程</button>
        </div>
      </div>

      <div class="field">
        <label id="countLabel">题量</label>
        <div class="pill-row" role="group" aria-labelledby="countLabel" id="countPills">
          <button class="pill-btn" data-value="10">10</button>
          <button class="pill-btn active" data-value="20">20</button>
          <button class="pill-btn" data-value="30">30</button>
          <button class="pill-btn" data-value="random">随机</button>
        </div>
      </div>

      <button class="start" id="startBtn">开始自测</button>
    </div>
  </section>

  <!-- 阶段 2：答题 -->
  <section class="stage" id="quizStage" aria-label="答题">
    <div class="topbar">
      <div class="progress">第 <strong id="currentNum">1</strong> / <strong id="totalNum">3</strong> 题 · <strong id="typeLabel" style="color:var(--accent-deep);">选择题</strong></div>
      <div class="progress">本轮正确率 <strong id="accRate">0%</strong></div>
    </div>
    <div class="bar" aria-hidden="true"><div id="progressFill"></div></div>

    <div class="quiz">
      <div class="q-type" id="qType">选择题 · 导数模块</div>
      <p class="q-text" id="qText">以下哪个是 <code>sec x</code> 的导数？</p>
      <div class="q-formula" id="qFormula">\((\sec x)' = \ ?\)</div>

      <!-- 选择题选项 -->
      <div class="q-options" id="choiceOptions" role="group" aria-label="选项"></div>

      <!-- 填空题 -->
      <div class="fill-row" id="fillRow" style="display:none;">
        <input class="fill-input" id="fillInput" type="text" placeholder="输入 LaTeX 或文字答案，如 sec x tan x" autocomplete="off" />
        <button class="submit-btn" id="fillSubmit">提交</button>
      </div>

      <!-- 判断题 -->
      <div class="tf-row" id="tfRow" style="display:none;" role="group" aria-label="判断">
        <button class="tf-btn" data-value="true">正确 <kbd>Y</kbd></button>
        <button class="tf-btn" data-value="false">错误 <kbd>N</kbd></button>
      </div>

      <div class="feedback" id="feedback" aria-live="polite" role="status">
        <strong id="fbTitle"></strong>
        <span id="fbBody"></span>
        <div class="mnemonic" id="fbMnemonic"></div>
      </div>

      <div class="quiz-foot">
        <div class="acc">累计答对 <strong id="correctCount">0</strong> / <strong id="answeredCount">0</strong></div>
        <button class="next" id="nextBtn" disabled>下一题 →</button>
      </div>
    </div>
  </section>

  <!-- 阶段 3：结果 -->
  <section class="stage" id="resultStage" aria-label="成绩单">
    <div class="result">
      <div class="result-head">
        <div class="score-ring" id="scoreRing">
          <span class="score-num" id="scoreNum">0</span>
          <span class="score-label">分</span>
        </div>
        <h2 class="result-title" id="resultTitle">完成本轮自测</h2>
        <p class="result-sub" id="resultSub">共 3 题 · 正确率 <strong id="resultAcc">0%</strong></p>
      </div>

      <div class="result-stats">
        <div class="stat"><div class="num" id="statTotal">3</div><div class="label">总题数</div></div>
        <div class="stat"><div class="num" id="statCorrect">0</div><div class="label">正确</div></div>
        <div class="stat"><div class="num" id="statWrong">0</div><div class="label">错误</div></div>
      </div>

      <div class="wrong-list" id="wrongList">
        <h3>错题回顾</h3>
      </div>

      <div class="result-actions">
        <button class="result-action" id="retryBtn">再来一轮</button>
        <button class="ghost-btn" id="addFlipBtn">错题加入翻卡</button>
      </div>
    </div>
  </section>

</main>

<script>
  // ===== Demo question bank =====
  const questions = [
    {
      type: 'choice',
      typeLabel: '选择题',
      module: '导数模块',
      text: '以下哪个是 sec x 的导数？',
      tex: '$(\\sec x)\' = \\ ?$',
      options: [
        { key: '1', tex: '\\sec x \\cdot \\tan x \\cdot (-1)', correct: false },
        { key: '2', tex: '\\sec x \\cdot \\tan x', correct: true },
        { key: '3', tex: '\\tan x / \\sec x', correct: false },
        { key: '4', tex: '\\sec^2 x', correct: false }
      ],
      answerText: '\\sec x \\cdot \\tan x',
      mnemonic: '记忆口诀：正变余、余变负。sec 的导数 = sec · tan。'
    },
    {
      type: 'fill',
      typeLabel: '填空题',
      module: '积分模块',
      text: '请填写下列不定积分的结果（可只写核心函数部分）：',
      tex: '\\displaystyle \\int \\sec x \\tan x \\, dx = \\ ? + C',
      answers: ['sec x', '\\sec x', 'sec(x)', '\\sec(x)'],
      answerText: '\\sec x + C',
      mnemonic: '联动说明：积分是导数的逆运算。sec x 的导数正是 sec x · tan x，所以它的原函数就是 sec x。'
    },
    {
      type: 'tf',
      typeLabel: '判断题',
      module: '三角模块',
      text: '判断下列等式是否成立：',
      tex: '\\sin 2x = 2 \\sin x \\cos x',
      correctValue: true,
      answerText: '等式成立',
      mnemonic: '记忆口诀：二倍角正弦 = 2 sin cos，由和角公式令两角相等得到。'
    }
  ];

  // ===== State =====
  let config = { module: 'all', count: '20' };
  let currentIndex = 0;
  let answers = []; // { questionIndex, correct }
  let currentAnswered = false;
  let currentCorrect = false;

  // ===== DOM refs =====
  const stages = {
    config: document.getElementById('configStage'),
    quiz: document.getElementById('quizStage'),
    result: document.getElementById('resultStage')
  };
  const modulePills = document.getElementById('modulePills');
  const countPills = document.getElementById('countPills');
  const startBtn = document.getElementById('startBtn');
  const nextBtn = document.getElementById('nextBtn');
  const feedback = document.getElementById('feedback');
  const choiceOptions = document.getElementById('choiceOptions');
  const fillRow = document.getElementById('fillRow');
  const fillInput = document.getElementById('fillInput');
  const fillSubmit = document.getElementById('fillSubmit');
  const tfRow = document.getElementById('tfRow');

  // ===== Helpers =====
  function setStage(name) {
    Object.values(stages).forEach(s => s.classList.remove('is-active'));
    stages[name].classList.add('is-active');
  }

  function normalize(s) {
    return s.toLowerCase().replace(/\s+/g, '').replace(/\\/g, '');
  }

  function renderKaTeX() {
    if (typeof katex === 'undefined') return;
    document.querySelectorAll('.q-formula').forEach(el => {
      try { katex.render(el.textContent, el, { throwOnError: false, displayMode: false }); } catch(e) {}
    });
    document.querySelectorAll('.opt-tex').forEach(el => {
      try { katex.render(el.dataset.tex || el.textContent, el, { throwOnError: false, displayMode: false }); } catch(e) {}
    });
  }

  function updateProgress() {
    const total = questions.length;
    const pct = ((currentIndex + (currentAnswered ? 1 : 0)) / total) * 100;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('currentNum').textContent = currentIndex + 1;
    document.getElementById('totalNum').textContent = total;
    const answered = answers.length + (currentAnswered ? 1 : 0);
    const correct = answers.filter(a => a.correct).length + (currentAnswered && currentCorrect ? 1 : 0);
    document.getElementById('correctCount').textContent = correct;
    document.getElementById('answeredCount').textContent = answered;
    document.getElementById('accRate').textContent = answered ? Math.round(correct / answered * 100) + '%' : '0%';
  }

  function showFeedback(correct, answerText, mnemonic) {
    feedback.className = 'feedback show ' + (correct ? 'ok' : 'no');
    document.getElementById('fbTitle').textContent = correct ? '回答正确' : '正确答案：' + answerText;
    document.getElementById('fbBody').textContent = correct ? '继续保持，试试下一题。' : '再回顾一下相关公式。';
    document.getElementById('fbMnemonic').textContent = mnemonic;
  }

  function lockQuestion() {
    currentAnswered = true;
    nextBtn.disabled = false;
    nextBtn.focus();
  }

  function recordAnswer(correct) {
    currentCorrect = correct;
    answers.push({ questionIndex: currentIndex, correct });
  }

  // ===== Render question =====
  function renderQuestion() {
    const q = questions[currentIndex];
    currentAnswered = false;
    currentCorrect = false;
    feedback.className = 'feedback';
    nextBtn.disabled = true;

    document.getElementById('qType').textContent = q.typeLabel + ' · ' + q.module;
    document.getElementById('typeLabel').textContent = q.typeLabel;
    document.getElementById('qText').textContent = q.text;
    document.getElementById('qFormula').textContent = q.tex;

    // Reset choice UI
    choiceOptions.style.display = 'none';
    choiceOptions.innerHTML = '';
    fillRow.style.display = 'none';
    fillInput.value = '';
    fillInput.className = 'fill-input';
    fillSubmit.disabled = false;
    tfRow.style.display = 'none';
    tfRow.querySelectorAll('.tf-btn').forEach(b => { b.className = 'tf-btn'; b.disabled = false; });

    if (q.type === 'choice') {
      choiceOptions.style.display = 'grid';
      q.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'q-opt';
        btn.dataset.correct = opt.correct;
        btn.innerHTML = '<span class="opt-tex" data-tex="' + opt.tex.replace(/"/g, '&quot;') + '"></span><span class="key">' + opt.key + '</span>';
        btn.addEventListener('click', () => handleChoice(btn, opt.correct));
        choiceOptions.appendChild(btn);
      });
    } else if (q.type === 'fill') {
      fillRow.style.display = 'flex';
      fillInput.disabled = false;
      fillInput.focus();
    } else if (q.type === 'tf') {
      tfRow.style.display = 'flex';
      tfRow.querySelectorAll('.tf-btn').forEach(btn => {
        btn.addEventListener('click', () => handleTF(btn, btn.dataset.value === 'true'));
      });
    }

    updateProgress();
    requestAnimationFrame(renderKaTeX);
  }

  // ===== Handlers =====
  function handleChoice(btn, correct) {
    if (currentAnswered) return;
    choiceOptions.querySelectorAll('.q-opt').forEach(b => {
      b.disabled = true;
      if (b.dataset.correct === 'true') b.classList.add('correct');
    });
    if (!correct) btn.classList.add('wrong');
    recordAnswer(correct);
    showFeedback(correct, questions[currentIndex].answerText, questions[currentIndex].mnemonic);
    lockQuestion();
    updateProgress();
  }

  function handleFillSubmit() {
    if (currentAnswered) return;
    const q = questions[currentIndex];
    const val = fillInput.value.trim();
    if (!val) return;
    const norm = normalize(val);
    const correct = q.answers.some(a => normalize(a) === norm);
    fillInput.disabled = true;
    fillSubmit.disabled = true;
    fillInput.classList.add(correct ? 'correct' : 'wrong');
    recordAnswer(correct);
    showFeedback(correct, q.answerText, q.mnemonic);
    lockQuestion();
    updateProgress();
  }

  function handleTF(btn, chosenTrue) {
    if (currentAnswered) return;
    const q = questions[currentIndex];
    const correct = chosenTrue === q.correctValue;
    tfRow.querySelectorAll('.tf-btn').forEach(b => {
      b.disabled = true;
      if ((b.dataset.value === 'true') === q.correctValue) b.classList.add('correct');
    });
    if (!correct) btn.classList.add('wrong');
    recordAnswer(correct);
    showFeedback(correct, q.answerText, q.mnemonic);
    lockQuestion();
    updateProgress();
  }

  function finishQuiz() {
    setStage('result');
    const total = questions.length;
    const correct = answers.filter(a => a.correct).length;
    const wrong = total - correct;
    const score = Math.round(correct / total * 100);

    document.documentElement.style.setProperty('--score-deg', score * 3.6 + 'deg');
    document.getElementById('scoreNum').textContent = score;
    document.getElementById('resultSub').innerHTML = '共 ' + total + ' 题 · 正确率 <strong id="resultAcc">' + score + '%</strong>';
    document.getElementById('statTotal').textContent = total;
    document.getElementById('statCorrect').textContent = correct;
    document.getElementById('statWrong').textContent = wrong;

    const wrongList = document.getElementById('wrongList');
    wrongList.innerHTML = '<h3>错题回顾</h3>';
    const wrongAnswers = answers.filter(a => !a.correct);
    if (wrongAnswers.length === 0) {
      wrongList.innerHTML += '<p style="color:var(--muted);font-size:14px;">太棒了，本轮没有错题！</p>';
    } else {
      wrongAnswers.forEach(a => {
        const q = questions[a.questionIndex];
        const item = document.createElement('div');
        item.className = 'wrong-item';
        item.innerHTML = '<div class="q-title">' + (a.questionIndex + 1) + '. ' + q.text + '</div>' +
          '<div class="q-answer">正确答案：' + q.answerText + ' · ' + q.mnemonic + '</div>';
        wrongList.appendChild(item);
      });
    }

    if (wrongAnswers.length === 0) {
      document.getElementById('addFlipBtn').style.display = 'none';
    } else {
      document.getElementById('addFlipBtn').style.display = 'inline-block';
    }
  }

  function restart() {
    currentIndex = 0;
    answers = [];
    currentAnswered = false;
    currentCorrect = false;
    document.documentElement.style.setProperty('--score-deg', '0deg');
    setStage('config');
  }

  // ===== Config pills =====
  function bindPills(container, key) {
    container.addEventListener('click', e => {
      const btn = e.target.closest('.pill-btn');
      if (!btn) return;
      container.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      config[key] = btn.dataset.value;
    });
  }
  bindPills(modulePills, 'module');
  bindPills(countPills, 'count');

  // ===== Buttons =====
  startBtn.addEventListener('click', () => {
    setStage('quiz');
    renderQuestion();
  });

  nextBtn.addEventListener('click', () => {
    if (!currentAnswered) return;
    if (currentIndex < questions.length - 1) {
      currentIndex++;
      renderQuestion();
    } else {
      finishQuiz();
    }
  });

  fillSubmit.addEventListener('click', handleFillSubmit);
  fillInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') handleFillSubmit();
  });

  document.getElementById('retryBtn').addEventListener('click', restart);
  document.getElementById('addFlipBtn').addEventListener('click', () => {
    const btn = document.getElementById('addFlipBtn');
    btn.textContent = '已加入翻卡记忆';
    btn.disabled = true;
  });

  // ===== Keyboard shortcuts =====
  document.addEventListener('keydown', e => {
    if (!stages.quiz.classList.contains('is-active')) return;
    const q = questions[currentIndex];
    if (currentAnswered) {
      if (e.key === 'Enter') nextBtn.click();
      return;
    }
    if (q.type === 'choice') {
      const idx = parseInt(e.key, 10);
      if (idx >= 1 && idx <= 4) {
        const btn = choiceOptions.children[idx - 1];
        if (btn) btn.click();
      }
    } else if (q.type === 'tf') {
      if (e.key.toLowerCase() === 'y') tfRow.children[0].click();
      if (e.key.toLowerCase() === 'n') tfRow.children[1].click();
    } else if (q.type === 'fill') {
      if (e.key === 'Enter') handleFillSubmit();
    }
  });

  // Theme toggle stub
  document.getElementById('themeBtn').addEventListener('click', () => {
    document.body.classList.toggle('dark');
  });

  // Initial render
  requestAnimationFrame(renderKaTeX);
</script>
